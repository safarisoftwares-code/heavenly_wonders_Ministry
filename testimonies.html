<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testimonies — Heavenly Wonders Ministry</title>
<style>
:root { --bg:#f4f7f4; --card:#ffffff; --text:#1e2f2e; --border:#e2ede4; --primary:#2c6e49; --action:#3d9970; --gold:#c9a227; --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family: var(--font); color: var(--text); line-height:1.7; background: var(--bg); padding:4rem 1.5rem; min-height:100vh; }
.container { max-width:900px; margin:0 auto; }
h1 { color: var(--primary); font-size:2.25rem; margin-bottom:0.5rem; text-align:center; }
.subtitle { text-align:center; color:#6b7d73; margin-bottom:2rem; font-size:1.05rem; font-style:italic; }
.gold-rule { width:60px; height:3px; background: var(--gold); margin:0 auto 2.5rem auto; border-radius:2px; }
.testimony-grid { display:grid; grid-template-columns:1fr; gap:1.5rem; }
.testimony-card { background: var(--card); border-radius:12px; padding:2rem; box-shadow: 0 8px 32px rgba(0,0,0,0.1); border-left:4px solid var(--gold); }
.testimony-name { color: var(--primary); font-size:1.15rem; font-weight:700; margin-bottom:0.25rem; }
.testimony-location { color:#6b7d73; font-size:0.85rem; margin-bottom:1rem; }
.testimony-text { color: var(--text); font-size:1rem; line-height:1.8; font-style:italic; }
.testimony-date { color:#6b7d73; font-size:0.8rem; margin-top:1rem; border-top:1px solid var(--border); padding-top:0.75rem; }
.empty-state { text-align:center; padding:3rem; background: var(--card); border-radius:12px; color:#6b7d73; font-style:italic; }
.back-link { display:inline-block; margin-top:2rem; padding:0.8rem 1.5rem; background: var(--action); color:#fff; border-radius:8px; font-weight:600; text-decoration:none; }
.back-link:hover { background: var(--primary); }
@media (min-width: 768px) { .testimony-grid { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<div class="container">
<h1>Testimonies</h1>
<div class="gold-rule"></div>
<p class="subtitle">"They overcame him by the blood of the Lamb and by the word of their testimony." — Revelation 12:11</p>
<div id="testimonyList" class="testimony-grid">
    <div class="empty-state">Loading testimonies...</div>
</div>
<div style="text-align:center;">
    <a href="index.html" class="back-link">← Back to the Ministry</a>
</div>
</div>

<script>
fetch('get-testimonies.php?t=' + new Date().getTime())
    .then(function(res) { return res.json(); })
    .then(function(data) {
        const list = document.getElementById('testimonyList');
        if (!data || data.length === 0) {
            list.innerHTML = '<div class="empty-state">✝️ Testimonies are coming soon. Check back to read what God is doing.</div>';
            return;
        }
        let html = '';
        data.forEach(function(t) {
            html += '<div class="testimony-card">';
            html += '<div class="testimony-name">' + escapeHtml(t.name) + '</div>';
            if (t.location) html += '<div class="testimony-location">📍 ' + escapeHtml(t.location) + '</div>';
            html += '<div class="testimony-text">"' + escapeHtml(t.testimony).replace(/\n/g, '<br>') + '"</div>';
            if (t.date) html += '<div class="testimony-date">📅 ' + escapeHtml(t.date) + '</div>';
            html += '</div>';
        });
        list.innerHTML = html;
    })
    .catch(function() {
        document.getElementById('testimonyList').innerHTML = '<div class="empty-state">✝️ Testimonies are coming soon. Check back to read what God is doing.</div>';
    });

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
</body>
</html>
